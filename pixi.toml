# Python, Node and pyarrow are locked by pixi; the page's libraries and jsdom by npm.
[workspace]
name = "rgi-explorer"
description = "A static web map to explore the Randolph Glacier Inventory 7.0 from its cloud-native mirror."
license = "MIT"
license-file = "LICENSE"
readme = "README.md"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]
# Minimum pixi version; CI installs the latest release.
requires-pixi = ">=0.80"

[dependencies]
python = "3.12.*"
nodejs = "24.*"
# The smoke test reads the staged GeoParquet to compare it with the page's reads.
pyarrow = "*"

[tasks]
# The page's libraries and the test dependencies, from package-lock.json.
install = "npm ci"
test-py = "python -m unittest discover -s tests -v"
test-js = { cmd = "npm test", depends-on = ["install"] }
test = { depends-on = ["test-py", "test-js"] }
smoke = { cmd = "SMOKE=1 node --test tests/smoke.test.js", depends-on = ["install"] }
serve = { cmd = "python scripts/serve.py", depends-on = ["install"] }
