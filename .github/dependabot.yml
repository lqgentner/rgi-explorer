# Dependabot moves the npm packages (the page's libraries and the test tools)
# and the action versions in the workflows, monthly and in one pull request per
# ecosystem, so one merge and one deploy take a month's updates. Version updates
# wait seven days after a release, long enough for regressions to be reported;
# security updates do not wait. A merged update deploys the site, so nothing
# merges itself. A page library that gains a dependency needs its license in
# assets/third-party-licenses.txt by hand; the tests catch a new bare import
# the import map lacks.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    # @types/node follows the major in .node-version: bump both together by hand.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
