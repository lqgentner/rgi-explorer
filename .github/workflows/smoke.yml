name: Smoke test

# Checks the published catalog, which changes without a commit here.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    # A stalled connection ends the job instead of holding it for hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Node's major version comes from .node-version; npm's cache from package-lock.json.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run smoke
