name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments without interrupting one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Test the exact commit being published.
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node's major version comes from .node-version; npm's cache from package-lock.json.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install the page's libraries
        run: npm ci

      # Publish the runtime files and the page's libraries. The data stays in the mirror.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html style.css sw.js _site/
          cp -r js assets _site/
          node scripts/stage-libraries.mjs _site
          du -sh _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
